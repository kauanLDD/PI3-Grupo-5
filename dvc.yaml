# O grafo do pipeline. Cada estágio declara o que lê, qual parâmetro usa e o que escreve,
# e o dvc.lock guarda o hash disso tudo a cada execução.
#
# A base bruta do LUNA16 não entra como dependência: são 112 GB num HD que é de leitura,
# e o caminho até ela muda de máquina para máquina. Ver docs/decisoes/0005.
#
# As figuras são `cache: false` porque continuam versionadas no git: a mesma imagem vai para
# o Sprint Review e depois para o paper. O DVC guarda o hash delas, o git guarda o arquivo.

vars:
  - configuracao/config.yaml

stages:
  inventario:
    cmd: python scripts/02_inventario_volumes.py
    deps:
      - scripts/02_inventario_volumes.py
      - src/config.py
      - src/dataset/volumes.py
    params:
      - configuracao/config.yaml:
          - selecao.subsets
    outs:
      - dados/intermediario/inventario_volumes.csv

  coordenadas:
    cmd: python scripts/03_verificar_coordenadas.py
    deps:
      - scripts/03_verificar_coordenadas.py
      - src/config.py
      - src/dataset/volumes.py
      - src/preprocessing/coordenadas.py
      - src/visualization/fatias.py
      - dados/intermediario/inventario_volumes.csv
    params:
      - configuracao/config.yaml:
          - pre_processamento.hu_min
          - pre_processamento.hu_max
    outs:
      - relatorios/figuras/coordenada_rai.png:
          cache: false
          persist: true
      - relatorios/figuras/coordenada_lpi.png:
          cache: false
          persist: true

  preprocessar:
    cmd: python scripts/04_preprocessar.py
    deps:
      - scripts/04_preprocessar.py
      - src/config.py
      - src/dataset/volumes.py
      - src/preprocessing/volume.py
      - src/visualization/fatias.py
      - dados/intermediario/inventario_volumes.csv
    params:
      - configuracao/config.yaml:
          - pre_processamento.hu_min
          - pre_processamento.hu_max
          - pre_processamento.espacamento_alvo
    outs:
      # O exame é o de maior nódulo entre os de direção identidade, escolhido pelo próprio
      # script a partir do inventário. Declarado pelo caminho porque `dados/processado` guarda
      # o README que explica a pasta, e o DVC não assume diretório que o git já rastreia.
      - dados/processado/1.3.6.1.4.1.14519.5.2.1.6279.6001.287966244644280690737019247886.mha
      - relatorios/figuras/preprocessamento.png:
          cache: false
          persist: true

  eda:
    cmd: python scripts/05_eda.py
    deps:
      - scripts/05_eda.py
      - src/config.py
      - src/dataset/volumes.py
      - src/visualization/eda.py
      - dados/intermediario/inventario_volumes.csv
    params:
      - configuracao/config.yaml:
          - seed
          - selecao.subsets
          - pre_processamento.hu_min
          - pre_processamento.hu_max
          - pre_processamento.espacamento_alvo
          - candidatos.patch
    outs:
      - relatorios/figuras/eda_espacamento_z.png:
          cache: false
          persist: true
      - relatorios/figuras/eda_diametro.png:
          cache: false
          persist: true
      - relatorios/figuras/eda_nodulos_por_scan.png:
          cache: false
          persist: true
      - relatorios/figuras/eda_hu.png:
          cache: false
          persist: true
      - relatorios/figuras/eda_desbalanceamento.png:
          cache: false
          persist: true

  espacamento:
    cmd: python scripts/06_escolher_espacamento.py
    deps:
      - scripts/06_escolher_espacamento.py
      - src/config.py
      - src/dataset/volumes.py
      - src/preprocessing/volume.py
      - src/visualization/eda.py
      - dados/intermediario/inventario_volumes.csv
    params:
      - configuracao/config.yaml:
          - seed
          - selecao.subsets
          - pre_processamento.hu_min
          - pre_processamento.hu_max
          - candidatos.patch
    outs:
      - dados/intermediario/espacamento.csv
      - relatorios/figuras/eda_espacamento_alvo.png:
          cache: false
          persist: true

  base:
    cmd: python scripts/07_preprocessar_base.py
    deps:
      - scripts/07_preprocessar_base.py
      - src/config.py
      - src/dataset/volumes.py
      - src/preprocessing/volume.py
      - dados/intermediario/inventario_volumes.csv
    params:
      - configuracao/config.yaml:
          - selecao.subsets
          - pre_processamento.hu_min
          - pre_processamento.hu_max
          - pre_processamento.espacamento_alvo
    outs:
      # `cache: false` pela decisão 0005: o DVC guarda o hash dos 888 volumes e não o conteúdo.
      # São 8,6 GiB que o pipeline refaz em 39,8 minutos, e não temos remote para onde mandar.
      - dados/processado/volumes:
          cache: false
      - dados/intermediario/preprocessamento.csv

  candidatos:
    cmd: python scripts/08_comparar_candidatos.py
    deps:
      - scripts/08_comparar_candidatos.py
      - src/config.py
      - src/detection/candidatos.py
      - dados/intermediario/inventario_volumes.csv
    outs:
      - dados/intermediario/comparacao_candidatos.csv

  marcacoes_excluidas:
    cmd: .venv/bin/python scripts/12_marcacoes_excluidas.py
    deps:
      - scripts/12_marcacoes_excluidas.py
      - requirements-rastreamento.lock.txt
      - dados/intermediario/candidatos.csv
      - ${caminhos.luna16_anotacoes}
      - ${caminhos.luna16_anotacoes_excluidas}
      - ${caminhos.luna16_candidatos}
      - src/config.py
      - src/detection/candidatos.py
      - dados/intermediario/inventario_volumes.csv
    outs:
      - dados/intermediario/marcacoes_excluidas.csv:
          cache: false
          persist: true

  evidencia_normalizacao:
    cmd: python scripts/11_evidencia_normalizacao.py
    deps:
      - scripts/11_evidencia_normalizacao.py
      - src/config.py
      - src/preprocessing/volume.py
      - src/dataset/volumes.py
      - dados/intermediario/inventario_volumes.csv
    params:
      - configuracao/config.yaml:
          - seed
          - selecao.subsets
          - pre_processamento.hu_min
          - pre_processamento.hu_max
          - evidencia_normalizacao.seriesuid
          - evidencia_normalizacao.faixa_pulmonar
    outs:
      - dados/intermediario/evidencia_normalizacao.csv
      - relatorios/figuras/normalizacao_hu.png:
          cache: false
          persist: true

  divisao:
    cmd: .venv/bin/python scripts/13_criar_divisao.py
    deps:
      - scripts/13_criar_divisao.py
      - src/config.py
      - src/dataset/divisao.py
      - dados/intermediario/pacientes.csv
    params:
      - configuracao/config.yaml:
          - seed
          - divisao
    outs:
      - dados/processado/divisao.csv:
          cache: false
          persist: true

  deteccao:
    cmd: .venv/bin/python scripts/10_detectar_candidatos.py
    deps:
      - scripts/10_detectar_candidatos.py
      - requirements-rastreamento.lock.txt
      - src/config.py
      - src/detection/blobs.py
      - src/detection/rodada.py
      - src/detection/candidatos.py
      - src/visualization/fatias.py
      - dados/processado/volumes
      - dados/intermediario/inventario_volumes.csv
      - dados/intermediario/preprocessamento.csv
      - dados/intermediario/comparacao_candidatos.csv
      - ${caminhos.luna16_anotacoes}
      - ${caminhos.luna16_candidatos}
      - ${caminhos.luna16_candidatos_original}
    params:
      - configuracao/config.yaml:
          - seed
          - deteccao
          - avaliacao
    outs:
      - dados/intermediario/candidatos.csv:
          cache: false
          persist: true
      - dados/intermediario/cobertura_candidatos_proprios.csv:
          cache: false
          persist: true
      - dados/intermediario/falhas_deteccao.csv:
          cache: false
          persist: true
      - dados/intermediario/situacao_deteccao.csv:
          cache: false
          persist: true
      - dados/intermediario/troca_cobertura_candidatos.csv:
          cache: false
          persist: true
      - relatorios/figuras/deteccao_candidatos.png:
          cache: false
          persist: true

  # Experimento encerrado. O protocolo preserva as versões e os hashes originais.
  # Reexecutar com outro ambiente exige uma nova pasta de experimento.
  calibracao:
    frozen: true
    cmd: .venv/bin/python scripts/12_calibrar_detector.py
    deps:
      - scripts/12_calibrar_detector.py
      - src/config.py
      - src/detection/calibracao.py
      - src/detection/blobs.py
      - src/detection/candidatos.py
      - dados/processado/volumes
      - dados/intermediario/pacientes.csv
      - ${caminhos.luna16_anotacoes}
    params:
      - configuracao/config.yaml:
          - seed
          - calibracao_log
          - avaliacao
    outs:
      - dados/intermediario/calibracao_log:
          cache: false
          persist: true

  features:
    foreach:
      - treino
      - validacao
    do:
      cmd: .venv/bin/python scripts/14_extrair_caracteristicas.py --particao ${item}
      deps:
        - scripts/14_extrair_caracteristicas.py
        - requirements-rastreamento.lock.txt
        - src/config.py
        - src/detection/features.py
        - src/detection/patches.py
        - dados/processado/divisao.csv
        - dados/processado/volumes
        - ${caminhos.luna16_candidatos}
      params:
        - configuracao/config.yaml:
            - seed
            - candidatos.patch
            - caracteristicas
      outs:
        - dados/intermediario/caracteristicas_${item}.csv:
            cache: false
            persist: true
        - dados/intermediario/auditoria_caracteristicas_${item}.csv:
            cache: false
            persist: true
        - dados/intermediario/falhas_caracteristicas_${item}.csv:
            cache: false
            persist: true

  registrar_preparacao:
    cmd: .venv/bin/python scripts/15_registrar_preparacao.py
    deps:
      - scripts/15_registrar_preparacao.py
      - src/experimentos/preparacao.py
      - src/detection/features.py
      - src/experimentos/rastreamento.py
      - src/config.py
      - requirements-rastreamento.lock.txt
      - dados/processado/divisao.csv
      - dados/intermediario/caracteristicas_treino.csv
      - dados/intermediario/caracteristicas_validacao.csv
      - dados/intermediario/auditoria_caracteristicas_treino.csv
      - dados/intermediario/auditoria_caracteristicas_validacao.csv
      - dados/intermediario/falhas_caracteristicas_treino.csv
      - dados/intermediario/falhas_caracteristicas_validacao.csv
      - ${caminhos.luna16_candidatos}
    params:
      - configuracao/config.yaml:
          - seed
          - candidatos.patch
          - rastreamento.experimento
    outs:
      - dados/intermediario/mlflow_preparacao.json:
          cache: false
          persist: true

  treinar_random_forest:
    cmd: .venv/bin/python scripts/17_treinar_random_forest.py
    deps:
      - scripts/17_treinar_random_forest.py
      - src/experimentos/floresta.py
      - src/experimentos/preparacao.py
      - src/experimentos/rastreamento.py
      - src/detection/features.py
      - src/config.py
      - requirements-rastreamento.lock.txt
      - dados/processado/divisao.csv
      - dados/intermediario/caracteristicas_treino.csv
      - dados/intermediario/caracteristicas_validacao.csv
      - dados/intermediario/auditoria_caracteristicas_treino.csv
      - dados/intermediario/auditoria_caracteristicas_validacao.csv
      - dados/intermediario/falhas_caracteristicas_treino.csv
      - dados/intermediario/falhas_caracteristicas_validacao.csv
      - ${caminhos.luna16_candidatos}
    params:
      - configuracao/config.yaml:
          - seed
          - random_forest
          - rastreamento.experimento
          - caminhos.random_forest
    outs:
      - ${caminhos.random_forest}:
          cache: false
          persist: true
